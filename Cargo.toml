[workspace]
resolver = "2"
members = [
    "maat",
    "kha",
    "akernet/akernet-bridge",
    "ra/ra-wm",
    "ra/ra-panel",
    "ra/ra-config",
    "ra/ra-shell",
    "opium",
    "harvester",
    "anubis",
    "thoth",
    "daemons/system_core/logd",
    "daemons/system_core/healthd",
    "daemons/system_core/timed",
    "daemons/system_core/mountd",
    "daemons/system_core/entropyd",
    "daemons/system_core/kha-watchd",
    "daemons/network_akernet/netd",
    "daemons/network_akernet/wifid",
    "daemons/network_akernet/dnsd",
    "daemons/network_akernet/vpnd",
    "daemons/network_akernet/firewalld",
    "daemons/network_akernet/proxyd",
]

# Shared dependencies across all workspace members
[workspace.dependencies]
tokio       = { version = "1",       features = ["full"] }
serde       = { version = "1",       features = ["derive"] }
serde_json  = "1"
toml        = "0.8"
axum        = "0.7"
tracing             = "0.1"
tracing-subscriber  = "0.3"
anyhow      = "1"
thiserror   = "1"
clap        = { version = "4", features = ["derive"] }
sysinfo     = "0.30"
chrono      = "0.4"

[workspace.metadata]
project     = "Osiris OS"
version     = "0.1.0-alpha"
authors     = ["droidmaster"]
description = "A modular, freedom-first operating system ecosystem"
