# /etc/osiris/osiris.conf - Osiris OS Core Configuration
# Managed by OPIUM/Harvester; do not edit directly unless in Netjeru mode

[system]
# Release channel: ramesses (stable) | netjeru (unstable)
channel = "ramesses"

# Architecture: auto-detected at install
arch = "aarch64"

# Init system
init = "/sbin/kha"

# Daemon orchestration
bridge_socket = "/tmp/osiris-bridge.sock"
bridge_http = "0.0.0.0:7474"

[paths]
# Osiris root (read-only package store)
osiris_root = "/osiris"

# Mutable state
var_root = "/osiris/var"
run_root = "/osiris/run"
config_root = "/etc/osiris"

# Package management
pkg_db = "/osiris/var/lib/osiris/pkgdb"
pkg_cache = "/osiris/var/cache/osiris"
harvest_root = "/osiris/var/lib/harvester"

# Logging
log_root = "/osiris/var/log/osiris"
bootstrap_log = "/osiris/var/log/osiris/bootstrap.log"
ring_log = "/osiris/var/log/osiris/logd.ring"

# Entropy
entropy_seed = "/osiris/var/lib/osiris/entropy.seed"

[daemons]
# SystemCore domain - load order matters
system_core = [
    "logd",
    "healthd",
    "timed",
    "mountd",
    "entropyd",
    "kha-watchd"
]

# NetworkAkernet domain (depends on netd)
network_akernet = [
    "netd",
    "wifid",
    "dnsd",
    "vpnd",
    "firewalld",
    "proxyd"
]

# Other domains (implemented later)
# hardware = ["batteryd", "modemd", "camerad", "sensorsd", "vibrd", "gpiod", "thermald", "fwatchd"]
# input = ["inputd", "btd", "usbd", "displayd"]
# display_graphics = ["displayd", "compositord", "brightd", "rotationd"]
# audio = ["audiod", "voiced", "meliad"]
# user_session = ["sessiond", "appd", "convergenced", "clipboardd"]
# security = ["cryptd", "permd", "auditd", "biod"]
# services = ["notifyd", "syncd", "locationd", "updated"]

[network]
# Default interfaces managed by netd
default_interface = "wlan0"
fallback_interface = "eth0"

# DNS
dns_servers = ["1.1.1.1", "9.9.9.9"]
dns_over_tls = true
adguard_home_url = "http://127.0.0.1:3000"

# VPN
kill_switch_default = true
allowed_vpn_protocols = ["wireguard", "openvpn"]

# Firewall
default_policy = "deny"
logging_enabled = true

# Proxy
proxy_chains = ["socks5", "http", "shadowsocks"]
rotation_interval_minutes = 30

[entropy]
min_warning_bits = 1024
min_critical_bits = 192
seed_save_interval_secs = 300
urandom_path = "/dev/urandom"

[time]
ntp_servers = ["pool.ntp.org", "time.google.com", "time.cloudflare.com"]
poll_interval_secs = 60
drift_warning_ms = 1000
drift_critical_ms = 5000
sync_stale_threshold_secs = 600

[health]
cpu_warning_pct = 80.0
cpu_critical_pct = 95.0
memory_warning_pct = 80.0
memory_critical_pct = 95.0
disk_warning_pct = 85.0
disk_critical_pct = 95.0
temp_warning_c = 80.0
temp_critical_c = 95.0

[mount]
poll_interval_ms = 30000
fstab_path = "/etc/fstab"
mountinfo_path = "/proc/self/mountinfo"
proot_fallback = true
zfs_scrub_alert = true
btrfs_scrub_alert = true