[package]
name        = "kha-watchd"
version     = "0.1.0-alpha"
edition     = "2021"
description = "Assessor #1 — Monitors Kha (PID 1) itself, system heartbeat"
authors     = ["droidmaster"]

[[bin]]
name = "kha-watchd"
path = "src/main.rs"

[dependencies]
maat       = { path = "../../../maat" }
tokio      = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
anyhow     = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { workspace = true }
chrono     = { workspace = true }
signal-hook = "0.3"
libc       = "0.2"